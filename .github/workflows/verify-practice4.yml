name: Verify practice 4 Java
on:
  push:
    paths:
      - 'practice_4/**'
      - '.github/workflows/verify-practice4.yml'
  workflow_dispatch:

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile all practice 4 classes
        shell: bash
        run: |
          mkdir -p build
          javac -encoding UTF-8 -d build $(find practice_4 -name '*.java')
      - name: Check recursion tasks and boundaries
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local class="$1" input="$2" expected="$3"
            local actual
            actual="$(printf '%b' "$input" | java -cp build "ru.mirea.oop.p4.recursion.$class" | xargs)"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$class input=$input expected=[$expected] actual=[$actual]"
              exit 1
            fi
            echo "PASS $class ($input)"
          }
          check Task01 '7\n' '1 2 2 3 3 3 4'
          check Task02 '5\n' '1 2 3 4 5'
          check Task03 '5 2\n' '5 4 3 2'
          check Task03 '-2 2\n' '-2 -1 0 1 2'
          check Task04 '2 3\n' '3'
          check Task04 '1 9\n' '1'
          check Task04 '2 0\n' '0'
          check Task05 '10203\n' '6'
          check Task06 '2\n' 'YES'
          check Task06 '97\n' 'YES'
          check Task06 '100\n' 'NO'
          check Task06 '1000000007\n' 'YES'
          check Task07 '84\n' '2 2 3 7'
          check Task07 '97\n' '97'
          check Task07 '1000000007\n' '1000000007'
          check Task08 'radar\n' 'YES'
          check Task08 'hello\n' 'NO'
          check Task09 '2 2\n' '3'
          check Task09 '3 1\n' '0'
          check Task09 '0 0\n' '1'
          check Task10 '12345\n' '54321'
          check Task11 '1 0 1 0 0 1\n' '2'
          check Task12 '1 2 3 4 0\n' '1 3'
          check Task13 '10 20 30 40 0\n' '10 30'
          check Task14 '1020\n' '1 0 2 0'
          check Task15 '1020\n' '0 2 0 1'
          check Task16 '3 7 4 7 0\n' '2'
          check Task17 '3 7 4 0\n' '7'
      - name: Check exception examples
        shell: bash
        run: |
          set -euo pipefail
          check_text() {
            local class="$1" input="$2" needle="$3"
            local actual
            actual="$(printf '%b' "$input" | java -cp build "ru.mirea.oop.p4.exceptions.$class")"
            if [[ "$actual" != *"$needle"* ]]; then
              echo "::error::$class expected substring=[$needle] actual=[$actual]"
              exit 1
            fi
            echo "PASS $class ($needle)"
          }
          check_text Task01 '' 'Infinity'
          check_text Task02 'Qwerty\n' 'Invalid integer'
          check_text Task02 '0\n' 'Attempted division by zero'
          check_text Task02 '1.2\n' 'Invalid integer'
          check_text Task02 '1\n' '= 2'
          check_text Task03 '0\n' 'Attempted division by zero'
          check_text Task04 '0\n' 'Finally: input attempt finished'
          check_text Task04 '1\n' 'Finally: input attempt finished'
          check_text Task05 '' 'Caller handled'
          check_text Task06 '' 'Program continues'
          check_text Task07 '\n' 'Handled in main'
          check_text Task08 '\nvalid\n' 'data for valid'
