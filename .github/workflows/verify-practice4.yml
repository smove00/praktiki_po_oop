name: Verify practice 4 Java
on:
  push:
    paths:
      - 'practice_4/**'
      - '.github/workflows/verify-practice4.yml'
  workflow_dispatch:

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile selected tasks (three from each part)
        shell: bash
        run: |
          mkdir -p build
          find practice_4 -name '*.java' -print0 | xargs -0 javac -encoding UTF-8 -d build
      - name: Check recursion 1-3
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local task="$1" input="$2" expected="$3"
            local actual
            actual="$(printf '%b' "$input" | java -cp build "ru.mirea.oop.p4.recursion.$task")"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::$task expected [$expected] got [$actual]"
              exit 1
            fi
          }
          check Task01 '7\n' '1 2 2 3 3 3 4'
          check Task01 '10\n' '1 2 2 3 3 3 4 4 4 4'
          check Task02 '5\n' '1 2 3 4 5'
          check Task02 '1\n' '1'
          check Task03 '5 2\n' '5 4 3 2'
          check Task03 '-2 2\n' '-2 -1 0 1 2'
          check Task03 '4 4\n' '4'
          echo 'Recursion tasks 1-3 passed'
      - name: Check exception tasks 1-3
        shell: bash
        run: |
          set -euo pipefail
          test_task() {
            local task="$1" input="$2" expected="$3"
            local actual
            actual="$(printf '%b' "$input" | java -cp build "ru.mirea.oop.p4.exceptions.$task")"
            if [[ "$actual" != *"$expected"* ]]; then
              echo "::error::$task expected substring [$expected] got [$actual]"
              exit 1
            fi
          }
          test_task Task01 '' 'Infinity'
          for cls in Task02 Task03; do
            test_task "$cls" 'Qwerty\n' 'Invalid integer'
            test_task "$cls" '1.2\n' 'Invalid integer'
            test_task "$cls" '0\n' 'Attempted division by zero'
            test_task "$cls" '1\n' '= 2'
          done
          echo 'Exception tasks 1-3 passed'
